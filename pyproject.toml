[project]
name = "python-automation-scraping-toolkit"
version = "0.1.0"
description = "Competitor price & stock monitoring plus lead-to-CRM automation: scraping, FastAPI, Postgres, Google Sheets, HubSpot, Slack/Telegram, n8n and Make."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Yusuf İslam Yetkin" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "selectolax>=0.3.26",
    "playwright>=1.49",
    "tenacity>=9.0",
    "structlog>=24.4",
    "arq>=0.26",
    "typer>=0.15",
    "gspread>=6.1",
    "google-auth>=2.36",
    "openpyxl>=3.1",
]

[project.scripts]
toolkit = "toolkit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "aiosqlite>=0.20",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolkit"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501", "W291"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["toolkit"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["gspread.*", "google.*", "arq.*", "selectolax.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs Docker (Testcontainers)"]
